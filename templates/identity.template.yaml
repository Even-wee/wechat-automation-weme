# ============================================================
# 模板 1/5 · identity.template.yaml —— 作者身份画像（必填）
# ------------------------------------------------------------
# 这是整条流水线里最重要的文件。
# AI 写文章时，所有"我是谁""我做过""我用过"都只能从这份文件取材，
# 严禁虚构。写得不全 = AI 没素材可用 = 文章空洞。
#
# 填写原则：
#   · 只填真实、可公开的信息
#   · 每一项至少填 1 条，越多越好（AI 的素材库）
#   · 不确定的可以先留空，但"写作边界"建议认真填（防翻车）
# ============================================================

# ===== 1. 基础信息 =====
name: "你的姓名或笔名"            # 例：张三
account_name: "你的公众号名称"     # 例：张三的美食日记
public_level: "全公开"            # 全公开 / 半公开 / 匿名
location: "所在城市或地区"         # 例：湖南长沙（可选）
age: 30                          # 可选

# ===== 2. 真实身份（AI 写"我是..."时从这里取）=====
main_job:
  title: "主业头衔"               # 例：美食探店博主
  company: "公司或机构"            # 例：本地餐饮集团（匿名可写行业）
  years: 5                       # 从业年限（可选）
  one_liner: "一句话简介，不超过30字"  # 例：用真实探店记录帮吃货避开踩雷

side_jobs:                       # 副业/斜杠身份，可多条
  - name: "副业 1 名称"
    what: "你在做什么（不超过20字）"
  - name: "副业 2 名称"
    what: "你在做什么"

identity_tags:                   # AI 写"我是"时只能从这些标签里挑
  - "标签 1"                      # 例：创业讲师
  - "标签 2"                      # 例：官方背书讲师
  - "标签 3"
  - "标签 4"

# ===== 3. 账号定位（决定每篇选题的调性）=====
account_positioning: "一句话说明你的账号定位"   # 例：本地生活 + 美食探店 + 真实分享
primary_audience:                # 核心读者，AI 写文章时脑子里想的就是他们
  - "读者群体 1"                  # 例：城市吃货
  - "读者群体 2"                  # 例：周末觅食党
  - "读者群体 3"

# ===== 4. 日常工具/业务/方法论（AI 写"我用 XX 方法..."时从这里取）=====
daily_tools:                     # 你日常用到的工具、方法、业务
  category_1:                    # 可自定义分类名
    - "工具或方法 1"              # 例：探店拍摄记录
    - "工具或方法 2"              # 例：门店菜单测评
  category_2:
    - "工具或方法 3"

# ===== 5. 真实痛点池（AI 写"我踩过 XX 坑..."时只能从这里取）=====
real_pains:
  group_1:                       # 可自定义分组名
    - "真实痛点 1"                # 例：不敢开播，长期停在准备阶段
    - "真实痛点 2"                # 例：只会介绍产品，不会建立信任
  group_2:
    - "真实痛点 3"

# ===== 6. 真实案例库（AI 写"我见过 XX 案例..."时从这里取）=====
real_cases:
  - name: "案例 1 名称"
    what: "案例内容简述"
    role: "你在其中扮演的角色"
  - name: "案例 2 名称"
    what: "案例内容简述"
    role: "你在其中扮演的角色"

# ===== 7. 写作边界（防翻车护栏，建议认真填）=====
forbidden:
  - "绝对不写的：1"               # 例：不虚构学员姓名、成交额、订单量
  - "绝对不写的：2"               # 例：不夸大培训效果，不承诺涨粉变现
  - "绝对不写的：3"               # 例：不把政策解读写成法律或投资建议

# ===== 8. 署名（文末作者卡用）=====
signature: "你的署名"             # 例：AI Agent 从业者 YJ
