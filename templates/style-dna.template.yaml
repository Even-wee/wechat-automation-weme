# ============================================================
# 模板 4/5 · style-dna.template.yaml —— 14 维文风 DNA（核心）
# ------------------------------------------------------------
# 这是"作者文风指纹"——AI 写作时最重要的风格基准。
# DNA 是"学出来的"不是"填出来的"：
#   推荐用 init.sh 的「范文建模」模式：提供 3-10 篇自己的历史文章，
#   自动量化分析提炼出这份 DNA（复用 wewrite-learn 逻辑）。
#   下面是各维度的说明，你也可以手动填写大概印象。
#
# 填写原则：
#   · 每一维填得越具体，AI 写出来越像你
#   · 不会填的维度可以留空，脚本会用默认值兜底
# ============================================================

# ===== 一句话指纹（最重要的维度）=====
# 用一句话说清楚"我的文章是什么味道"。
# 例：语气温柔但骨架硬，每段必有真实经验支撑，结尾必留"我也能做"的实操信心。
fingerprint: "用一句话描述你的文风指纹"

# ===== 1. 词汇层：你的个人词库 =====
lexicon:
  # 你写作时爱用的词，按功能分组
  style_1:                      # 可自定义分组（如"教学感"）
    - "常用词 1"
    - "常用词 2"
  style_2:                      # 可自定义分组（如"信任感"）
    - "常用词 3"
  style_3:                      # 可自定义分组（如"行动感"）
    - "常用词 4"
  style_4:                      # 可自定义分组（如"情感感"）
    - "常用词 5"

# ===== 2. 句法层：你的句式指纹 =====
syntax_patterns:
  # 你反复使用的句式模板，AI 会模仿
  patterns:
    - form: "句式模板 1"         # 例："X，不是 A，是 B"
      example: "例句 1"          # 例："不是流量不行，是不懂合规"
    - form: "句式模板 2"         # 例："唯有 A，才能 B"
      example: "例句 2"
    - form: "句式模板 3"
      example: "例句 3"
  forbidden:
    - "你不用的句式"             # 例：不用"如果……就……"长条件句

# ===== 3. 修辞层：开场与金句 =====
rhetoric:
  openings:                     # 你的文章怎么开场
    - "开场方式 1"               # 例：从具体场景切入，不用宏大开头
    - "开场方式 2"
  golden_lines:                 # 你的金句怎么用
    style: "金句独立成段"         # 例：金句独立成段，不加引号
    frequency: "每篇 2-3 句"

# ===== 4. 节奏层：段落与长度 =====
rhythm:
  paragraph_length: "短"        # 短 / 中 / 长（例：短，2-4 行一段）
  sentence_variation: "长短句交替" # 例：长短句交替制造节奏
  separators: "· · ·"           # 章节分隔符

# ===== 5. 结构层：文章骨架 =====
structure:
  default_framework: "观点输出"  # 例：热点解读 / 实操指南 / 案例复盘 / 方法论 / 观点输出
  sections:                     # 常用章节数
    - "章节 1"                   # 例：01 先让用户知道你是谁
    - "章节 2"
    - "章节 3"

# ===== 6. 语气层：人称与温度 =====
tone:
  person: "第一人称"             # 第一人称 / 第二人称 / 混合
  warmth: "温暖但克制"           # 例：温暖但克制，不说教
  authority: "同行分享"          # 例：专家口吻 / 同行分享 / 朋友聊天

# ===== 7. 举例层：素材来源偏好 =====
examples:
  source: "真实经历优先"          # 例：真实经历优先，不用编造的案例
  density: "每篇 2-3 个"         # 举例密度

# ===== 8. 结尾层 =====
ending:
  style: "回环呼应"              # 例：回环呼应开头 / 抛开放式问题 / 行动号召
  cta: "留一个'我也能做'的信心"    # 结尾 CTA 风格

# ===== 9-14. 其余维度（高级，可留空）=====
advanced:
  # 9. 数字使用：什么时候用具体数字（例：关键数据必给，其他少用）
  numbers: "关键数据必给"
  # 10. 引用使用：引别人话的频率与方式
  quotes: "少用，只用真实说过的话"
  # 11. 网络用语：用不用梗和网络新词
  slang: "基本不用"
  # 12. 排比/对比：修辞手法偏好
  rhetoric_devices: "适度用对比"
  # 13. 专业术语：术语密度
  jargon: "适度，必须白话解释"
  # 14. 立场表达：表达观点的方式
  stance: "结论清楚，但不绝对"
