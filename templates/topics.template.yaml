# ============================================================
# 模板 2/5 · topics.template.yaml —— 选题赛道配置（必填）
# ------------------------------------------------------------
# 这份文件决定两件事：
#   1. 步骤① 采集时按哪些关键词粗筛（redfox_adapter 读）
#   2. 步骤② 评分时"赛道匹配度"怎么算（topic_scorer 读）
#
# 填写原则：
#   · 赛道 3 个左右最佳，太多会分散
#   · 权重 = 你对这个赛道的重视程度（10 最高）
#   · 关键词越贴合你的赛道，筛出来的选题越准
# ============================================================

# ===== 核心赛道（可增删）=====
tracks:
  A:                        # 主赛道（权重最高）
    name: "赛道 A 名称"       # 例：美食探店实操
    weight: 10               # 满分 10，你的主赛道
    keywords:                # 采集与评分都按这些词命中
      - "关键词 1"            # 例：美食探店
      - "关键词 2"            # 例：餐厅探店
      - "关键词 3"            # 例：新店打卡
      - "关键词 4"
      - "关键词 5"
      - "关键词 6"

  B:                        # 次赛道
    name: "赛道 B 名称"       # 例：生活方式分享
    weight: 8
    keywords:
      - "关键词 1"
      - "关键词 2"
      - "关键词 3"

  C:                        # 第三赛道（可选）
    name: "赛道 C 名称"       # 例：行业政策观察
    weight: 6
    keywords:
      - "关键词 1"
      - "关键词 2"

# ===== 评分权重（一般不用改，高级用户可调）=====
# 这 5 个权重决定选题评分公式，总和应为 1.0
scoring_weights:
  track_match: 0.30     # 赛道匹配度（关键词命中）
  seo_value: 0.25       # SEO 价值（以热度代理）
  timeliness: 0.20      # 时效性（越新分越高）
  dedup: 0.15           # 历史去重（避免重复选题）
  account_fit: 0.10     # 账号匹配（是否贴合人设）

# ===== 过滤规则 =====
filters:
  min_score: 6.0        # 综合得分低于此值的选题自动丢弃
  time_window: "最近24h" # 采集时间窗口：最近24h / 最近72h / 最近7d
  max_topics: 20        # 每日进入飞书表的选题数
